# ============================================================
# Production profile - used on Render (free tier).
# Activate it with the environment variable: SPRING_PROFILES_ACTIVE=prod
#
# EVERY value below is a ${ENV_VAR} placeholder filled in by
# Render. No real credentials live in this file - it is safe to commit.
# ============================================================

# Render injects the free tier port here (defaults to 8080 locally).
server.port=${PORT:8080}

# ---------- PostgreSQL (Render free database) ----------
# The URL defaults to the Render Postgres instance (Oregon) and can be
# overridden via SPRING_DATASOURCE_URL if the database ever moves.
# No credentials are embedded here - username/password come from env vars.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://dpg-daglllu7bikc73bns5kg-a.oregon-postgres.render.com:5432/vshoba_boutique?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / Hibernate ----------
# "update" creates/migrates tables on startup. Same as local dev.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ---------- Secrets (never hardcoded - injected by Render) ----------
# JWT signing secret. Generate one with: openssl rand -base64 48
# Fail-fast: the app will NOT start if this is missing or shorter than 32 bytes.
app.jwt.secret=${JWT_SECRET}
# Optional previous secret, used only to VERIFY tokens signed before a rotation.
# Set JWT_PREVIOUS_SECRET (in Render) to the OLD secret value right after rotating JWT_SECRET.
app.jwt.previous-secret=${JWT_PREVIOUS_SECRET:}
app.jwt.expiration-ms=86400000

# The H2 console is a development-only tool. Prod uses Postgres, so never
# expose the console here even though the shared SecurityConfig permits it.
spring.h2.console.enabled=false

# Razorpay test-mode credentials (set to test values initially).
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}