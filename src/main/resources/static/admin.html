<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - V Shoba's Boutique</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1 onclick="location.href='/'">V Shoba's <span>Boutique</span> Admin</h1>
    <div class="spacer"></div>
    <div id="adminUser"></div>
  </header>

  <main style="max-width:1000px">
    <!-- Login gate -->
    <div class="panel" id="loginGate" style="max-width:420px;margin:60px auto">
      <h2>Admin Login</h2>
      <div class="err" id="loginErr" style="color:#d9534f;min-height:1.2em"></div>
      <form id="adminLoginForm" style="display:flex;flex-direction:column;gap:10px">
        <input type="email" id="adminEmail" placeholder="Admin email" required>
        <input type="password" id="adminPassword" placeholder="Password" required>
        <button type="submit" class="btn">Login</button>
      </form>
    </div>

    <div id="dashboard" style="display:none">
      <div style="display:flex;gap:10px;margin-bottom:16px">
        <button class="btn" id="tabInventory">Inventory</button>
        <button class="btn" id="tabOrders">Orders</button>
        <button class="btn secondary" onclick="logout()">Logout</button>
      </div>

      <!-- Inventory tab -->
      <div id="inventoryTab">
        <div class="panel">
          <h2>Add / Edit Product</h2>
          <form class="grid-form" id="productForm">
            <input type="hidden" id="pfId">
            <input id="pfName" placeholder="Product name" required>
            <input id="pfCategory" placeholder="Category (e.g. Sarees)">
            <input id="pfPrice" type="number" step="0.01" min="0" placeholder="Price (₹)" required>
            <input id="pfStock" type="number" min="0" placeholder="Stock quantity" required>
            <input id="pfImage" class="full" placeholder="Image URL (optional)">
            <textarea id="pfDescription" class="full" rows="2" style="padding:9px;border:1px solid #d8c4ae;border-radius:6px" placeholder="Description" required></textarea>
            <div class="full row-actions">
              <button type="submit" class="btn">Save Product</button>
              <button type="button" class="btn secondary" onclick="resetForm()">Clear</button>
            </div>
          </form>
        </div>

        <div class="panel">
          <h2>Low Stock Warning</h2>
          <div id="lowStock"></div>
        </div>

        <div class="panel">
          <h2>All Products</h2>
          <div id="productsTable"></div>
        </div>
      </div>

      <!-- Orders tab -->
      <div id="ordersTab" style="display:none">
        <div class="panel">
          <h2>All Orders</h2>
          <div id="ordersTable"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
