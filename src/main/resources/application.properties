# ============================================================
# Default profile: used every time you run the app.
# Uses an H2 database stored in a file, so data survives restarts.
# Perfect for development - no MySQL installation required.
# ============================================================

spring.application.name=v-shoba-boutique

server.port=8080

# ---------- H2 database (development) ----------
spring.datasource.url=jdbc:h2:file:./data/boutique;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------- JPA / Hibernate ----------
# "update" creates tables if missing and adds new columns as models grow.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- H2 web console ----------
# Open http://localhost:8080/h2-console (JDBC URL: jdbc:h2:file:./data/boutique)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JWT (Phase 5) ----------
# Secret used to sign login tokens. MUST be at least 32 characters.
# Generate a real random one before deploying (e.g. openssl rand -base64 48).
# The app REFUSES to start if this is missing or shorter than 32 bytes
# (see JwtConfig) - no silent fallback key is ever generated.
app.jwt.secret=dev-only-secret-change-me-before-deploying-0123456789abcdef
# Optional PREVIOUS secret, kept ONLY for verifying tokens issued before a
# rotation. New tokens are always signed with app.jwt.secret. Empty = disabled.
# On Render set JWT_PREVIOUS_SECRET to the old value right after rotating.
app.jwt.previous-secret=${JWT_PREVIOUS_SECRET:}
# Token lifetime in milliseconds (86400000 = 24 hours).
app.jwt.expiration-ms=86400000

# ---------- Razorpay (local development) ----------
# spring-dotenv loads the local .env file at startup so these resolve
# during `mvn spring-boot:run` without needing to export env vars.
# Empty = simulated payment mode (no real Razorpay checkout).
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
