# Render Blueprint - declarative deployment for V Shoba's Boutique.
# Uses the DOCKER runtime (Render no longer auto-detects Java/Maven buildpacks -
# it was falling back to Node.js). The Dockerfile builds the jar and runs it.
#
# Flow: push this file to GitHub, then on Render pick:
#   New + -> Blueprint -> connect this repo.
# Render creates the web service, builds the Docker image, and applies env vars.
#
# Empty (sync: false) values are filled in by hand on the Render dashboard
# after the blueprint creates the service - see README "Deploying to Render".

services:
  - type: web
    name: vshoba-boutique
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Auto-generates a secure random JWT signing secret (prod profile requires it).
      - key: JWT_SECRET
        generateValue: true
      # Filled in manually after creation, from the Render Postgres dashboard.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # Test-mode Razorpay credentials - set to real values before going live.
      - key: RAZORPAY_KEY
        sync: false
      - key: RAZORPAY_SECRET
        sync: false